ref: salesforce.execute_apex
label: "Salesforce Execute Anonymous Apex"
description: "Execute anonymous Apex code via the Tooling API and return compile/execution results."
enabled: true

runner_type: python
entry_point: execute_apex.py
parameter_delivery: stdin
parameter_format: json
output_format: json

default_execution_permission_set_refs:
  - standard


parameters:
  org_credential_key:
    type: string
    description: "Optional keystore key ref for a non-default Salesforce org credential object. Overrides credential_key/default_org_credential_key when provided."
  credential_key:
    type: string
    description: "Legacy alias for org_credential_key."
  credentials:
    type: object
    description: "Optional Salesforce credentials object passed directly to sf_toolkit.lazy_login. Takes precedence over org_credential_key/credential_key and supports fields such as username, password, consumer_key or client_id, consumer_secret or client_secret, private_key, domain, and security_token."
  username:
    type: string
    description: "Salesforce username to authenticate as when using org credential keys/default_org_credential_key."
  instance_url:
    { type: string, description: "Optional explicit instance URL (overrides what lazy_login returns)." }
  api_version:
    { type: string, default: "v60.0" }

  apex: { type: string, required: true, description: "Anonymous Apex code to execute." }

output_schema:
  ok:              { type: boolean, description: "True if compiled and executed without errors." }
  compiled:        { type: boolean }
  success:         { type: boolean }
  compile_problem: { type: string }
  exception_message: { type: string }
  exception_stack:   { type: string }
  line:    { type: integer }
  column:  { type: integer }
  result:  { type: object, description: "Full Tooling API response." }

tags: [salesforce, apex, tooling]
