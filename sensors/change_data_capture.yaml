ref: salesforce.change_data_capture
label: "Salesforce Change Data Capture Sensor"
description: "Subscribes to one or more Salesforce Change Data Capture channels via CometD/Bayeux long-polling, and emits salesforce.change_event events for every CDC notification received. Supports replay_id-based resume (modern replacement for the legacy PushTopic Streaming API)."
enabled: true

runner_type: python
entry_point: change_data_capture.py

trigger_types:
  - salesforce.change_event

parameters:
  org_credential_key:
    type: string
    description: "Optional keystore key ref for a non-default Salesforce org credential object. Overrides credential_key/default_org_credential_key when provided."
  credential_key:
    type: string
    description: "Legacy alias for org_credential_key."
  credentials:
    type: object
    description: "Optional Salesforce credentials object passed directly to sf_toolkit.lazy_login. Takes precedence over org_credential_key/credential_key and supports fields such as username, password, consumer_key or client_id, consumer_secret or client_secret, private_key, domain, and security_token."
  username:
    type: string
    description: "Salesforce username to authenticate as when using org credential keys/default_org_credential_key."
  connection_name:
    type: string
    description: "Optional in-process connection cache name when using direct credentials. Defaults to a hash of the credential fields."
  instance_url:
    { type: string, description: "Optional explicit instance URL (overrides what lazy_login returns)." }
  api_version:
    { type: string, default: "v60.0" }

  objects:
    type: array
    description: |
      Object API names to subscribe to as CDC channels (mutually exclusive with
      `channel` and `all_events`):
        ["Account", "Contact"]   -> /data/AccountChangeEvent, /data/ContactChangeEvent
        ["Invoice__c"]           -> /data/Invoice__ChangeEvent
  all_events:
    type: boolean
    default: false
    description: "Subscribe to /data/ChangeEvents (all CDC events). Mutually exclusive with `channel` and `objects`."
  channel:
    type: string
    description: |
      Optional raw Salesforce CDC channel (mutually exclusive with `objects` and
      `all_events`; preserved for backward compatibility):
        /data/ChangeEvents                    — all CDC events
        /data/<SObject>ChangeEvent            — standard object (e.g. /data/AccountChangeEvent)
        /data/<CustomObject>__ChangeEvent     — custom object
  replay_id:
    type: integer
    default: -1
    description: "Initial replay value: -1 = new events only, -2 = events from the retention window. Persisted state overrides this after the first event."
  reconnect_interval_seconds:
    type: integer
    default: 5

poll_interval: 1

tags: [salesforce, cdc, streaming, cometd]
